# TestFlight Distribution Workflow
#
# REQUIRED GITHUB SECRETS — configure all of these in your repo Settings → Secrets → Actions:
#
# Code Signing:
#   BUILD_CERTIFICATE_BASE64       — Your Apple Distribution certificate (.p12), base64-encoded
#                                    Generate: base64 -i YourCert.p12 | tr -d '\n'
#   P12_PASSWORD                   — Password for the .p12 certificate
#   BUILD_PROVISION_PROFILE_BASE64 — App Store provisioning profile (.mobileprovision), base64-encoded
#                                    Generate: base64 -i YourProfile.mobileprovision | tr -d '\n'
#   PROVISIONING_PROFILE_NAME      — Exact name of the provisioning profile (from Apple Developer portal)
#   DEVELOPMENT_TEAM               — Your 10-character Apple Team ID (e.g. ABC123DEFG)
#   KEYCHAIN_PASSWORD              — Any strong random password for the temporary CI keychain
#
# App Store Connect API Key (for uploading):
#   APP_STORE_CONNECT_API_KEY_ID   — Key ID from App Store Connect → Users & Access → Keys
#   APP_STORE_CONNECT_ISSUER_ID    — Issuer ID from the same page
#   APP_STORE_CONNECT_API_KEY_BASE64 — Contents of the downloaded .p8 key file, base64-encoded
#                                      Generate: base64 -i AuthKey_KEYID.p8 | tr -d '\n'
#
# App Configuration:
#   TOOLKIT_URL                    — Your Rork Toolkit API URL (from your Rork project dashboard)

name: Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Inject Toolkit URL into Config.swift
        run: |
          cat > ios/DinnerParty/Config.swift << 'SWIFT'
          // Config.swift - Generated at build time
          import Foundation
          enum Config {
              static let EXPO_PUBLIC_TOOLKIT_URL = "TOOLKIT_URL_PLACEHOLDER"
          }
          SWIFT
          sed -i '' "s|TOOLKIT_URL_PLACEHOLDER|${{ secrets.TOOLKIT_URL }}|g" ios/DinnerParty/Config.swift

      - name: Install Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane beta

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
